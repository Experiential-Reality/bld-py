[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bld-py"
version = "0.1.0"
description = "Python bootstrap interpreter for BLD"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
bld = "bld_py.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
